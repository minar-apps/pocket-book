<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmadiyya Pocket Book</title>
<meta name="description" content="Searchable answers and references for tabligh, from official Ahmadiyya sources.">
<meta name="theme-color" content="#0f3d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Book">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1b2422;--mute:#5d6b68;--line:#e3dfd4;--acc:#0f5c55;--acc2:#e7f1ef;--gold:#b0862f;--mark:#fbe7a6;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111716;--card:#1a2321;--ink:#e8eeec;--mute:#9aaba7;--line:#2b3734;--acc:#5fc2b5;--acc2:#1f3532;--gold:#d8b25e;--mark:#5a4a14;--shadow:none}}
:root[data-theme=dark]{--bg:#111716;--card:#1a2321;--ink:#e8eeec;--mute:#9aaba7;--line:#2b3734;--acc:#5fc2b5;--acc2:#1f3532;--gold:#d8b25e;--mark:#5a4a14;--shadow:none}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:var(--acc)}button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--acc);margin:2px 0 8px}
.brand small{color:var(--mute);font-weight:400}
.sbox{position:relative}
.sbox input{width:100%;font-size:17px;padding:12px 40px 12px 40px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none}
.sbox input:focus{border-color:var(--acc)}
.sbox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.sbox .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:20px;color:var(--mute);padding:6px 10px;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13.5px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:760px;margin:0 auto;padding:12px 14px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:92px}
.tile .i{font-size:22px}.tile b{font-size:14.5px;line-height:1.25}.tile span{font-size:12.5px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow)}
.row .q{font-weight:600;line-height:1.35}
.row .s{font-size:14px;color:var(--mute);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--mute);align-items:center}
.tag{background:var(--acc2);color:var(--acc);border-radius:6px;padding:1px 7px;font-weight:600}
.tag.g{background:transparent;border:1px solid var(--line);color:var(--mute);font-weight:500}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.grp>summary{padding:11px 12px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary span{color:var(--mute);font-weight:400;font-size:13px}
details.grp .it{padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;line-height:1.35}
details.grp .it small{display:block;color:var(--mute);font-size:12px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
/* card view */
.cv h1{font-size:21px;line-height:1.3;margin:6px 0 4px}
.crumb{font-size:13px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;box-shadow:var(--shadow)}
.box .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);font-weight:700;margin-bottom:6px}
.box.short{border-left:4px solid var(--acc)}
.txt p{margin:0 0 .7em}.txt p:last-child{margin:0}
.ref{border-top:1px dashed var(--line);padding:10px 0}.ref:first-of-type{border-top:0;padding-top:2px}
.ar{font-family:Amiri,"Geeza Pro",serif;font-size:1.35em;direction:rtl;text-align:right;line-height:1.9}
.ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;font-size:1.15em;direction:rtl;text-align:right;line-height:2.2}
.tr{margin-top:4px}.cite{font-size:13.5px;color:var(--mute);margin-top:4px}
.scans{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.scans img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff}
.full{white-space:pre-wrap;font-size:.95em}
details.more>summary{cursor:pointer;font-weight:600;color:var(--acc);padding:2px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.note{font-size:12.5px;color:var(--mute)}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav.bot button b{font-size:19px;font-weight:400;line-height:1.2}
nav.bot button.on{color:var(--acc)}
.study{text-align:center}.study .q{font-size:19px;font-weight:600;margin:16px 0}
.load{padding:40px;text-align:center;color:var(--mute)}
.back{border:0;background:none;color:var(--acc);font-size:15px;padding:4px 0;cursor:pointer}
.hint{font-size:13px;color:var(--mute);margin:6px 2px 0}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px;font-size:12.5px;cursor:pointer;background:var(--card)}
</style>
</head>
<body>
<header>
  <div class="brand"><span>📗 Ahmadiyya Pocket Book</span><small id="count"></small></div>
  <div class="sbox"><span class="ic">🔍</span><input id="q" type="search" placeholder="Search a question, verse (3:144), word…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><button class="clr" id="clr" aria-label="Clear">×</button></div>
  <div class="chips" id="fchips"></div>
</header>
<main id="view"><div class="load">Loading…</div></main>
<nav class="bot">
  <button data-go="#/" id="nHome"><b>⌂</b>Home</button>
  <button data-go="#/topics" id="nTopics"><b>☰</b>Topics</button>
  <button data-go="#/saved" id="nSaved"><b>★</b>Saved</button>
  <button data-go="#/study" id="nStudy"><b>⟳</b>Study</button>
  <button data-go="#/more" id="nMore"><b>⋯</b>More</button>
</nav>
<script>
"use strict";
const $ = s => document.querySelector(s), V = $("#view");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("pb_" + k)) ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem("pb_" + k, JSON.stringify(v)) } catch {} } };
let D, BY = {}, T = {}, BODY = {}, F = { src: "all", kind: "all" };
const SOURCES = [["all","All sources"],["pb","Pocket Book & Urdu books"],["kt","Khalifatul Masih IV (rh)"],["site","Ahmadi Answers"],["wm","White Minaret"]];
const SRCOF = o => ({urdu:"pb",core:"pb",qandeel:"pb",book:"pb",tahir:"kt",site:"site",wm:"wm"})[o];
const KINDS = [["all","Everything"],["quran","Has Quran refs"],["hadith","Hadith"],["scan","Original scans"],["key","Key arguments"]];
// ---------- text helpers ----------
const AR_STRIP = /[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
const norm = s => String(s || "").toLowerCase().replace(/[’‘`]/g, "'").replace(/[āáà]/g, "a").replace(/[īí]/g, "i").replace(/[ūú]/g, "u").replace(/[ḥ]/g, "h").replace(/[ṣ]/g, "s").replace(/[ḍ]/g, "d").replace(/[ṭ]/g, "t").replace(/[ẓ]/g, "z").replace(/ʿ|ʾ/g, "");
const arNorm = s => String(s || "").replace(AR_STRIP, "").replace(/[إأآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
const SYN = [
 ["jesus","isa","esa","eesa","masih","messiah","christ","ibn maryam","son of mary"],["death","died","die","dead","wafat","mautt","maut","tawaffa","tawaffi","mutawaffika","tawaffaitani"],
 ["raised","rafa","rafaa","ascension","ascend","heaven","sky"],["seal","khatam","khatme","khatm","khataman","khatamun","finality","last prophet","nabiyyin"],
 ["mahdi","imam mahdi"],["dajjal","antichrist","dajal"],["descent","nuzul","second coming","return","coming"],["apostasy","apostate","murtad","irtidad"],
 ["jihad","holy war","sword"],["ahmad","mirza","ghulam ahmad","promised messiah","hazrat ahmad"],["prophet","nabi","rasul","messenger"],
 ["prophecy","prophecies","pishgoi"],["allegation","objection","accusation","aitraz","etiraz"],["lahori","lahoris","paigham","ishaat","muhammad ali"],
 ["khilafat","khalifa","caliph","caliphate","khilafah"],["trinity","triune"],["crucifixion","cross","crucified","salib","salab"],["kashmir","srinagar","roza bal","yus asaf"],
 ["muhammadi begum","nikah","marriage prophecy"],["eclipse","kusuf","khusuf","ramadan eclipses"],["plague","taun"],["revelation","wahi","ilham","inspiration"],
 ["women","woman","hijab","purdah","veil"],["god","allah","creator"],["atheist","atheism","dawkins","evolution"],["hadith","ahadith","hadees","narration"]
];
const SYNMAP = {}; SYN.forEach(g => g.forEach(w => SYNMAP[w] = g));
const stem = w => w.length > 4 ? w.replace(/(ies)$/, "y").replace(/(ing|ed|es|s)$/, "") : w;
const STOPW = new Set("a an the of to in on is are was were be what why how does do did who whom which and or for with about from by as at it this that there their his her he she they say says said tell me explain can could would should".split(" "));
function prep(c) {
  c._q = norm(c.q + " " + (c.g || "")); c._t = norm(c.tags); c._a = norm(c.a + " " + (c.x || ""));
  c._k = norm(c.kw + " " + c.ci + " " + c.pg); c._ar = arNorm(c.ar); c._src = SRCOF(c.o);
  c._quran = /\b\d{1,3}:\d{1,3}/.test(c.ci) || /\b\d{1,3}:\d{1,3}/.test(c.q); c._hadith = /bukh|muslim|tirmidh|dawud|dawood|nasai|majah|hadith|hadees|musnad|kanz/i.test(c.ci + " " + c.q + " " + c.tags);
}
function terms(q) {
  const raw = norm(q).replace(/[^\p{L}\p{N}:' -]/gu, " ").trim();
  const out = [];
  const vs = raw.match(/\b\d{1,3}:\d{1,3}\b/g) || [];
  let rest = raw.replace(/\b\d{1,3}:\d{1,3}\b/g, " ");
  // multi-word synonyms first
  for (const k of Object.keys(SYNMAP).filter(k => k.includes(" ")).sort((a, b) => b.length - a.length)) if (rest.includes(k)) { out.push({ alts: SYNMAP[k] }); rest = rest.replace(k, " "); }
  for (let w of rest.split(/\s+/)) {
    if (!w || (STOPW.has(w) && raw.split(/\s+/).length > 1)) continue;
    if (/[؀-ۿ]/.test(w)) { out.push({ ar: arNorm(w) }); continue; }
    const alts = new Set([w, stem(w)]); (SYNMAP[w] || SYNMAP[stem(w)] || []).forEach(x => alts.add(x));
    out.push({ alts: [...alts].filter(x => x.length > 1 || /\d/.test(x)) });
  }
  return { list: out, verses: vs, phrase: raw.length > 5 ? raw : "" };
}
const rxCache = {};
const rxw = w => rxCache[w] || (rxCache[w] = new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"));
function verseRx(v) { const [s, a] = v.split(":").map(Number); return new RegExp("(^|[^0-9])" + s + ":(" + a + "|" + (a + 1) + "|" + Math.max(a - 1, 0) + ")(?![0-9])"); }
function score(c, Q) {
  let total = 0;
  for (const t of Q.list) {
    let best = 0;
    if (t.ar) { if (c._ar.includes(t.ar)) best = 6; }
    else for (const w of t.alts) {
      const r = rxw(w), m = (f) => f.includes(w) && r.test(f);
      const s = m(c._q) ? 10 : m(c._t) ? 6 : m(c._a) ? 3 : m(c._k) ? 2 : 0;
      if (s > best) best = s; if (best === 10) break;
    }
    if (!best) return 0;
    total += best;
  }
  for (const v of Q.verses) { const r = verseRx(v); const s = r.test(c.ci) ? 12 : r.test(c.q) ? 12 : r.test(c.a) ? 4 : 0; if (!s) return 0; total += s; }
  if (Q.phrase && c._q.includes(Q.phrase)) total += 15;
  if (c.x) total += 1; if (c.h.r) total += 0.5; if (c.o === "core" || c.o === "urdu") total += 1;
  return total;
}
function passFilters(c) {
  if (F.src !== "all" && c._src !== F.src) return false;
  if (F.kind === "quran" && !c._quran) return false;
  if (F.kind === "hadith" && !c._hadith) return false;
  if (F.kind === "scan" && !c.h.s) return false;
  if (F.kind === "key" && !(c.o === "core" || c.o === "urdu" || /key arg/i.test(c.g))) return false;
  return true;
}
function search(q, topic) {
  const Q = terms(q); if (!Q.list.length && !Q.verses.length) return [];
  const res = [];
  for (const c of D.cards) { if (topic && c.t !== topic) continue; if (!passFilters(c)) continue; const s = score(c, Q); if (s) res.push([s, c]); }
  res.sort((a, b) => b[0] - a[0]); return res.map(r => r[1]);
}
function hl(text, q) {
  let h = esc(text); const Q = terms(q); const ws = Q.list.flatMap(t => t.alts || []).filter(w => w.length > 2).sort((a, b) => b.length - a.length).slice(0, 12);
  if (!ws.length) return h;
  const r = new RegExp("(" + ws.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return h.replace(r, "<mark>$1</mark>");
}
function snippet(c, q) {
  const t = c.a.replace(/\s+/g, " "); const Q = terms(q); const ws = Q.list.flatMap(x => x.alts || []).filter(w => w.length > 2);
  let i = -1; for (const w of ws) { i = norm(t).indexOf(w); if (i >= 0) break; }
  const s = i > 60 ? "…" + t.slice(i - 50, i + 170) : t.slice(0, 220);
  return hl(s, q);
}
// ---------- rendering ----------
const topicName = id => T[id] ? T[id].icon + " " + T[id].name : id;
const srcLabel = c => c.src;
function row(c, q) {
  return `<div class="row" data-id="${c.id}"><div class="q">${q ? hl(c.q, q) : esc(c.q)}</div>${c.a ? `<div class="s">${q ? snippet(c, q) : esc(c.a.slice(0, 200))}</div>` : ""}<div class="meta"><span class="tag">${esc(topicName(c.t))}</span><span class="tag g">${esc(srcLabel(c))}</span>${c.h.r && !c.h.s ? `<span>📖 ${c.h.r} ref${c.h.r > 1 ? "s" : ""}</span>` : ""}${c.h.s ? `<span>🖼 scans</span>` : ""}${c.x ? "<span>✍️ explained</span>" : ""}</div></div>`;
}
function rows(list, q, max = 60) {
  if (!list.length) return `<div class="empty">No matches. Try fewer words, a synonym (e.g. “wafat”, “tawaffa”), or a verse like 3:144.</div>`;
  const more = list.length > max ? `<button class="btn" id="more" style="width:100%;margin-top:6px">Show more (${list.length - max})</button>` : "";
  return `<div class="list">${list.slice(0, max).map(c => row(c, q)).join("")}</div>${more}`;
}
function bindRows(list, q, max = 60) {
  V.querySelectorAll(".row[data-id]").forEach(el => el.onclick = () => go("#/c/" + el.dataset.id));
  const m = $("#more"); if (m) m.onclick = () => { const box = m.previousElementSibling; box.insertAdjacentHTML("beforeend", list.slice(max, max + 60).map(c => row(c, q)).join("")); m.remove(); bindRowsMore(list, q, max + 60); };
}
function bindRowsMore(list, q, max) { V.querySelectorAll(".row[data-id]").forEach(el => el.onclick = () => go("#/c/" + el.dataset.id)); if (list.length > max) { V.insertAdjacentHTML("beforeend", `<button class="btn" id="more" style="width:100%;margin-top:6px">Show more (${list.length - max})</button>`); $("#more").onclick = () => { $("#more").remove(); V.querySelector(".list").insertAdjacentHTML("beforeend", list.slice(max, max + 60).map(c => row(c, q)).join("")); bindRowsMore(list, q, max + 60); }; } }
function chipsHTML() {
  return SOURCES.map(([k, n]) => `<button class="chip ${F.src === k ? "on" : ""}" data-src="${k}">${n}</button>`).join("") + `<span style="flex:none;width:6px"></span>` +
    KINDS.slice(1).map(([k, n]) => `<button class="chip ${F.kind === k ? "on" : ""}" data-kind="${k}">${n}</button>`).join("");
}
function drawChips() {
  const el = $("#fchips"); el.innerHTML = chipsHTML();
  el.querySelectorAll("[data-src]").forEach(b => b.onclick = () => { F.src = b.dataset.src; drawChips(); route(); });
  el.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { F.kind = F.kind === b.dataset.kind ? "all" : b.dataset.kind; drawChips(); route(); });
}
function paras(t) { return String(t || "").split(/\n{2,}/).map(p => p.trim()).filter(Boolean).map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join(""); }
function setNav(id) { document.querySelectorAll("nav.bot button").forEach(b => b.classList.toggle("on", b.id === id)); }
function browse() {
  setNav("nHome");
  const list = D.cards.filter(passFilters);
  const byT = {}; list.forEach(c => (byT[c.t] = byT[c.t] || []).push(c));
  const lbl = [F.src !== "all" ? SOURCES.find(s => s[0] === F.src)[1] : "", F.kind !== "all" ? KINDS.find(k => k[0] === F.kind)[1] : ""].filter(Boolean).join(" · ");
  V.innerHTML = `<div class="hint">${list.length} answers — ${esc(lbl)} · <a href="#" id="clrf">clear filter</a></div><div style="height:8px"></div>` +
    D.topics.filter(t => byT[t.id]).map(t => `<details class="grp"><summary>${t.icon} ${esc(t.name)}<span>${byT[t.id].length}</span></summary>${byT[t.id].map(c => `<div class="it" data-id="${c.id}">${esc(c.q)}<small>${esc(c.g || c.src)}</small></div>`).join("")}</details>`).join("");
  V.querySelectorAll(".it[data-id]").forEach(el => el.onclick = () => go("#/c/" + el.dataset.id));
  $("#clrf").onclick = e => { e.preventDefault(); F.src = "all"; F.kind = "all"; drawChips(); route(); };
}
function home() {
  setNav("nHome");
  const saved = store.get("saved", []).map(i => BY[i]).filter(Boolean), recent = store.get("recent", []).map(i => BY[i]).filter(Boolean);
  const keys = D.cards.filter(c => c.o === "core").slice(0, 8);
  const ex = ["Jesus died 5:118", "tawaffa", "Khatam an-Nabiyyin meaning", "Muhammadi Begum", "apostasy punishment", "Lahori nabi", "eclipses Ramadan", "Trinity", "Imam Mahdi and Messiah same person", "Kashmir tomb"];
  V.innerHTML = `<p class="hint">Try: ${ex.map(e => `<span class="kbd">${esc(e)}</span>`).join(" ")}</p>
  ${recent.length ? `<h2 class="sec">Recently opened</h2><div class="list">${recent.slice(0, 4).map(c => row(c)).join("")}</div>` : ""}
  <h2 class="sec">Topics</h2><div class="grid">${D.topics.filter(t => t.n).map(t => `<button class="tile" data-t="${t.id}"><span class="i">${t.icon}</span><b>${esc(t.name)}</b><span>${t.n} answers</span></button>`).join("")}</div>

function topic(id, q) {

  ${order.map(([g, l], i) => `<details class="grp" ${order.length < 4 || i === 0 ? "open" : ""}><summary>${esc(g)}<span>${l.length}</span></summary>${l.map(c => `<div class="it" data-id="${c.id}">${esc(c.q)}<small>${esc(c.src)}${c.h.s ? " · scans" : ""}${c.x ? " · explained" : ""}</small></div>`).join("")}</details>`).join("") || `<div class="empty">Nothing here with these filters.</div>`}`;

async function body(c) {
  if (BODY[c.b] === undefined) { try { BODY[c.b] = await (await fetch("data/b" + c.b + ".json")).json(); } catch { BODY[c.b] = null; } }
  return (BODY[c.b] || {})[c.id] || null;
}
function refHTML(r) {
  if (r.img) return "";
  return `<div class="ref">${r.ar ? `<div class="${r.lang === "ur" ? "ur" : "ar"}">${esc(r.ar)}</div>` : ""}${r.en ? `<div class="tr">${esc(r.en)}</div>` : ""}${r.cite ? `<div class="cite">— ${esc(r.cite)}</div>` : ""}</div>`;
}
async function card(id) {
  const c = BY[id]; if (!c) return home();
  setNav("");
  const rec = store.get("recent", []).filter(x => x !== id); rec.unshift(id); store.set("recent", rec.slice(0, 30));
  const saved = store.get("saved", []).includes(id);
  V.innerHTML = `<div class="cv"><button class="back" onclick="history.length>1?history.back():go('#/')">‹ Back</button>
   <div class="crumb"><span class="tag" style="cursor:pointer" onclick="go('#/t/${c.t}')">${esc(topicName(c.t))}</span>${c.g ? `<span>${esc(c.g)}</span>` : ""}</div>
   <h1>${esc(c.q)}</h1>
   <div class="note">Source: <b>${esc(c.src)}</b>${c.pg ? " · " + esc(c.pg) : ""}</div>
   <div class="acts"><button class="btn ${saved ? "p" : ""}" id="sv">${saved ? "★ Saved" : "☆ Save"}</button><button class="btn" id="cp">Copy</button>${navigator.share ? `<button class="btn" id="sh">Share</button>` : ""}</div>
   ${c.a ? `<div class="box short"><div class="lbl">In short</div><div class="txt">${paras(c.a)}</div></div>` : ""}
   ${c.x ? `<div class="box"><div class="lbl">Explanation</div><div class="txt">${paras(c.x)}</div></div>` : ""}

  $("#sv").onclick = () => { let s = store.get("saved", []); s = s.includes(id) ? s.filter(x => x !== id) : [id, ...s]; store.set("saved", s); card(id); };
  const b = await body(c);
  const refs = (b?.refs || []).filter(r => !r.img), scans = (b?.refs || []).filter(r => r.img);
  const rel = [...(c.rel || []).map(i => BY[i]).filter(Boolean), ...D.cards.filter(x => x.t === c.t && x.g === c.g && x.id !== c.id && !(c.rel || []).includes(x.id)).slice(0, 6)].slice(0, 6);
  $("#bd").innerHTML = (!b && c.h.f ? `<div class="box note">The full text is not saved on this device yet and you seem to be offline.</div>` : "") +
   (refs.length ? `<div class="box"><div class="lbl">References</div>${refs.map(refHTML).join("")}</div>` : "") +
   (b?.use ? `<div class="box"><div class="lbl">How to use it</div><div class="txt">${paras(b.use)}</div></div>` : "") +
   (b?.gr ? `<div class="box"><div class="lbl">Arabic point</div><div class="txt">${paras(b.gr)}</div></div>` : "") +
   (b?.obj?.length ? `<div class="box"><div class="lbl">Objections & replies</div>${b.obj.map(o => `<div class="ref"><b>${esc(o.q || o.o || "")}</b><div class="tr">${esc(o.a || o.r || "")}</div></div>`).join("")}</div>` : "") +
   (scans.length ? `<div class="box"><div class="lbl">Original scans</div><div class="scans">${scans.map(s => `<a href="${esc(s.img)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(s.img)}" alt="${esc(s.cite || "Scan")}"></a>`).join("")}</div><div class="note" style="margin-top:6px">${esc([...new Set(scans.map(s => s.cite))].join(" · "))}</div></div>` : "") +
   (b?.full ? `<div class="box"><details class="more"><summary>Read the full ${c.o === "tahir" ? "section" : "answer"} (${Math.max(1, Math.round(b.full.length / 1100))} min)</summary><div class="txt full" style="margin-top:10px">${paras(b.full)}</div>${c.ocr ? `<div class="note" style="margin-top:8px">Text read from a scanned book by OCR — check spelling and Arabic against the book.</div>` : ""}</details></div>` : "") +
   (b?.links?.length ? `<div class="box"><div class="lbl">Links</div>${b.links.map(l => `<div class="cite"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a></div>`).join("")}</div>` : "") +
   (c._hadith ? `<div class="note">Look up a hadith: <a href="https://sunnah.com/search?q=${encodeURIComponent(c.q.slice(0, 80))}" target="_blank" rel="noopener">search sunnah.com</a></div>` : "") +
   (rel.length ? `<h2 class="sec">Related</h2><div class="list">${rel.map(x => row(x)).join("")}</div>` : "") +
   `<p class="note" style="margin-top:14px">Draft reference card — check quotations against the original before presenting or publishing.</p>`;
  bindRows([]);
  const text = () => [c.q, "", c.a, c.x ? "\n" + c.x : "", ...refs.map(r => [r.ar, r.en, r.cite && "— " + r.cite].filter(Boolean).join("\n")), "", "Source: " + c.src + (c.pg ? ", " + c.pg : "")].join("\n").replace(/\n{3,}/g, "\n\n");
  $("#cp").onclick = async () => { try { await navigator.clipboard.writeText(text()); $("#cp").textContent = "Copied ✓"; } catch { $("#cp").textContent = "Copy failed"; } };
  if ($("#sh")) $("#sh").onclick = () => navigator.share({ title: c.q, text: text() }).catch(() => {});
  window.scrollTo(0, 0);
}
function saved() {
  setNav("nSaved"); const s = store.get("saved", []).map(i => BY[i]).filter(Boolean);
  V.innerHTML = `<h2 class="sec">Saved (${s.length})</h2>${s.length ? rows(s, "", 500) : `<div class="empty">Tap ☆ Save on any answer to keep it here.</div>`}`; bindRows(s);
}
function study(tid) {
  setNav("nStudy");
  const prog = store.get("study", {});
  if (!tid) { V.innerHTML = `<h2 class="sec">Study — pick a topic</h2><p class="note">Flashcards: read the question, think of the answer, then reveal. Cards you mark “Again” come back sooner.</p><div class="grid">${D.topics.filter(t => t.n).map(t => { const cs = D.cards.filter(c => c.t === t.id && (c.x || c.h.r)); const k = cs.filter(c => (prog[c.id] || 0) >= 2).length; return `<button class="tile" data-t="${t.id}"><span class="i">${t.icon}</span><b>${esc(t.name)}</b><span>${k}/${cs.length} known</span></button>`; }).join("")}</div>`; V.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go("#/study/" + b.dataset.t)); return; }
  const pool = D.cards.filter(c => c.t === tid && (c.x || c.h.r)).sort((a, b) => (prog[a.id] || 0) - (prog[b.id] || 0) || Math.random() - .5);
  window._seen = window._seen || new Set();

  window._seen.add(c.id);

  $("#rv").onclick = () => { $("#ans").style.display = "block"; $("#rv").parentNode.style.display = "none"; };
  $("#nx").onclick = $("#nx2").onclick = () => study(tid);
  const mark = d => { prog[c.id] = Math.max(0, (prog[c.id] || 0) + d); store.set("study", prog); study(tid); };
  $("#ag").onclick = () => mark(-1); $("#kn").onclick = () => mark(1); $("#op").onclick = () => go("#/c/" + c.id);
}
function more() {
  setNav("nMore"); const fs = store.get("fs", 16), th = store.get("theme", "auto");
  const n = {}; D.cards.forEach(c => n[c._src] = (n[c._src] || 0) + 1);
  V.innerHTML = `<h2 class="sec">Settings</h2><div class="box"><div class="acts" style="margin:0;align-items:center">Text size <button class="btn" id="fm">A−</button><button class="btn" id="fp">A+</button></div><div class="acts" style="margin:10px 0 0;align-items:center">Theme ${["auto", "light", "dark"].map(t => `<button class="btn ${th === t ? "p" : ""}" data-th="${t}">${t}</button>`).join("")}</div></div>
  <div class="box"><div class="lbl">Use offline</div><p class="note" style="margin-top:0">Answers you open are kept for offline use. To keep everything (about 20 MB), tap below once on Wi-Fi.</p><button class="btn p" id="dl">Save all for offline</button> <span class="note" id="dls"></span></div>
  <h2 class="sec">Sources</h2><div class="box txt"><p>${[["Al Islam Digital Library","https://new.alislam.org/library"],["The Holy Quran (Ahmadiyya)","https://www.alislam.org/quran/"],["Ahmadi Answers","https://ahmadianswers.com"],["White Minaret","https://whiteminaret.org"],["Sunnah.com (hadith)","https://sunnah.com"]].map(([n,u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join(" · ")}</p><p class="note">All cards are drafts made from these sources — check quotations against the original before presenting.</p></div>`;
  $("#fm").onclick = () => { store.set("fs", Math.max(13, fs - 1)); applyPrefs(); more(); };
  $("#fp").onclick = () => { store.set("fs", Math.min(22, fs + 1)); applyPrefs(); more(); };
  V.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { store.set("theme", b.dataset.th); applyPrefs(); more(); });
  $("#dl").onclick = async () => { const ks = [...new Set(D.cards.map(c => c.b))]; let i = 0; for (const k of ks) { await fetch("data/b" + k + ".json").catch(() => {}); $("#dls").textContent = `${++i}/${ks.length}`; } const scans = [...new Set(Object.values(BODY).flatMap(x => Object.values(x || {})).flatMap(b => (b.refs || []).filter(r => r.img && r.img.startsWith("scans/")).map(r => r.img)))]; for (const s of scans) await fetch(s).catch(() => {}); $("#dls").textContent = "Done ✓ — everything is saved on this device."; };

function applyPrefs() { document.documentElement.style.setProperty("--fs", store.get("fs", 16) + "px"); const th = store.get("theme", "auto"); if (th === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = th; }
// ---------- routing ----------
function go(h) { if (location.hash === h) route(); else location.hash = h; }
window.go = go;
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || "/"); const p = h.split("/").filter(Boolean);
  const q = $("#q").value.trim();
  $("#fchips").style.display = (p[0] === "c" || p[0] === "more" || p[0] === "study" || p[0] === "saved") ? "none" : "flex";
  if (p[0] === "c") return card(p[1]);
  if (p[0] === "t") return topic(p[1], p[2] || "");
  if (p[0] === "topics") return topics();
  if (p[0] === "saved") return saved();
  if (p[0] === "study") return study(p[1]);
  if (p[0] === "more") return more();
  if (p[0] === "s" && p[1]) { if (q !== p.slice(1).join("/")) $("#q").value = p.slice(1).join("/"); return results(p.slice(1).join("/")); }
  return q ? results(q) : (F.src !== "all" || F.kind !== "all") ? browse() : home();
}
let tm;
function onType() {
  const q = $("#q").value.trim(); $("#clr").style.display = q ? "block" : "none";
  clearTimeout(tm); tm = setTimeout(() => { const h = q ? "#/s/" + encodeURIComponent(q) : "#/"; if (location.hash.startsWith("#/s/") || location.hash === "#/" || !location.hash) history.replaceState(null, "", h); else history.pushState(null, "", h); route(); }, 140);
}
$("#q").addEventListener("input", onType);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { e.target.blur(); } });

document.querySelectorAll("nav.bot button").forEach(b => b.onclick = () => { if (b.dataset.go === "#/") { $("#q").value = ""; $("#clr").style.display = "none"; } go(b.dataset.go); });
window.addEventListener("hashchange", route);
applyPrefs();
(async () => {
  try { D = await (await fetch("data/index.json")).json(); } catch { V.innerHTML = `<div class="empty">Could not load the data. Check your connection and reload.</div>`; return; }
  D.topics.forEach(t => T[t.id] = t); D.cards.forEach(c => { BY[c.id] = c; prep(c); });

})();
